name: Apply Beta terrain generator
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace terrain generator
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'class BetaPerlin' in s:
              print('Beta terrain already applied')
              raise SystemExit(0)
          new=r'''const key=(x,y,z)=>x+','+y+','+z,get=(x,y,z)=>world.get(key(x,y,z))||0;
class BetaRandom{constructor(seed){this.m=(1n<<48n)-1n;this.s=(BigInt(seed)^0x5DEECE66Dn)&this.m}next(bits){this.s=(this.s*25214903917n+11n)&this.m;return Number(this.s>>BigInt(48-bits))}nextInt(n){let b,v;if(n<=0)throw Error('bound');if((n&(n-1))===0)return Math.floor(n*this.next(31)/2147483648);do{b=this.next(31);v=b%n}while(b-v+(n-1)<0);return v}nextDouble(){return(this.next(26)*67108864+this.next(27))/9007199254740992}}
class BetaPerlin{constructor(r){this.x=r.nextDouble()*256;this.y=r.nextDouble()*256;this.z=r.nextDouble()*256;this.p=new Int32Array(512);for(let i=0;i<256;i++)this.p[i]=i;for(let i=0;i<256;i++){const j=r.nextInt(256-i)+i,t=this.p[i];this.p[i]=this.p[j];this.p[j]=t;this.p[i+256]=this.p[i]}}noise(x,y,z){x+=this.x;y+=this.y;z+=this.z;const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z),fx=x-X,fy=y-Y,fz=z-Z,X0=X&255,Y0=Y&255,Z0=Z&255,u=fx*fx*fx*(fx*(fx*6-15)+10),v=fy*fy*fy*(fy*(fy*6-15)+10),w=fz*fz*fz*(fz*(fz*6-15)+10),A=this.p[X0]+Y0,AA=this.p[A]+Z0,AB=this.p[A+1]+Z0,B=this.p[X0+1]+Y0,BA=this.p[B]+Z0,BB=this.p[B+1]+Z0;const g=(h,a,b,c)=>{const q=h&15,r=q<8?a:b,t=q<4?b:q===12||q===14?a:c;return((q&1)?-r:r)+((q&2)?-t:t)},L=(a,b,t)=>a+t*(b-a);return L(L(L(g(this.p[AA],fx,fy,fz),g(this.p[BA],fx-1,fy,fz),u),L(g(this.p[AB],fx,fy-1,fz),g(this.p[BB],fx-1,fy-1,fz),u),v),L(L(g(this.p[AA+1],fx,fy,fz-1),g(this.p[BA+1],fx-1,fy,fz-1),u),L(g(this.p[AB+1],fx,fy-1,fz-1),g(this.p[BB+1],fx-1,fy-1,fz-1),u),v),w)}}
class BetaOctaves{constructor(r,n){this.g=Array.from({length:n},()=>new BetaPerlin(r))}generate(x,y,z,sx,sy,sz,nx,ny,nz){const out=new Float64Array(nx*ny*nz);let d=1;for(const g of this.g){let bx=x*d*sx,bz=z*d*sz,ix=Math.floor(bx),iz=Math.floor(bz);bx-=ix;bz-=iz;ix%=16777216;iz%=16777216;bx+=ix;bz+=iz;let p=0;for(let ax=0;ax<nx;ax++)for(let az=0;az<nz;az++)for(let ay=0;ay<ny;ay++)out[p++]+=g.noise(bx+ax*sx*d,y*d*sy+ay*sy*d,bz+az*sz*d)/d;d*=.5}return out}}
const betaRand=new BetaRandom(seed),betaLow=new BetaOctaves(betaRand,16),betaHigh=new BetaOctaves(betaRand,16),betaSelector=new BetaOctaves(betaRand,8),betaUnused=new BetaOctaves(betaRand,4),betaContinental=new BetaOctaves(betaRand,10),betaDepth=new BetaOctaves(betaRand,16),betaTrees=new BetaOctaves(betaRand,8);
function betaTerrainField(cx,cz){const sx=cx*4,sz=cz*4,cn=betaContinental.generate(sx,0,sz,1.121,1,1.121,5,1,5),dn=betaDepth.generate(sx,0,sz,200,1,200,5,1,5),sn=betaSelector.generate(sx,0,sz,684.412/80,684.412/160,684.412/80,5,33,5),ln=betaLow.generate(sx,0,sz,684.412,684.412,684.412,5,33,5),hn=betaHigh.generate(sx,0,sz,684.412,684.412,684.412,5,33,5),q=new Float64Array(825);let n=0;for(let x=0;x<5;x++)for(let z=0;z<5;z++){let c=(cn[x*5+z]+256)/512;c=Math.max(0,Math.min(1,c));c+=.5;let d=dn[x*5+z]/8000;if(d<0)d=-d*.3;d=d*3-2;if(d<0){d/=2;if(d<-1)d=-1;d/=1.4;d/=2;c=0}else{if(d>1)d=1;d/=8}d=d*17/16;const elevation=8+d*4;for(let y=0;y<33;y++){let off=(y-elevation)*12/c;if(off<0)off*=4;const a=ln[n]/512,b=hn[n]/512,m=(sn[n]/10+1)/2;let density=m<0?a:m>1?b:a+(b-a)*m;density-=off;if(y>29){const f=(y-29)/3;density=density*(1-f)-10*f}q[n++]=density}}return q}
function betaDensity(q,x,y,z){const gx=x>>2,gz=z>>2,fx=(x&3)/4,fz=(z&3)/4,gy=y>>3,fy=(y&7)/8,i=(gx*5+gz)*33+gy;const v=(a,b,c,d)=>{const ab=a+(b-a)*fx,cd=c+(d-c)*fx;return ab+(cd-ab)*fz};const a=q[i],b=q[((gx+1)*5+gz)*33+gy],c=q[(gx*5+gz+1)*33+gy],d=q[((gx+1)*5+gz+1)*33+gy],a2=q[i+1],b2=q[((gx+1)*5+gz)*33+gy+1],c2=q[(gx*5+gz+1)*33+gy+1],d2=q[((gx+1)*5+gz+1)*33+gy+1];return v(a,b,c,d)+(v(a2,b2,c2,d2)-v(a,b,c,d))*fy}
function betaHash(x,z){let n=(Math.imul(x,374761393)+Math.imul(z,668265263)+Math.imul(seed,1442695041))|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function height(x,z){for(let y=127;y>0;y--)if(solid(get(x,y,z)))return y;return 1}
function genChunk(cx,cz){const ck=cx+','+cz;if(chunks.has(ck))return;const q=betaTerrainField(cx,cz);for(let x=0;x<16;x++)for(let z=0;z<16;z++){const wx=cx*16+x,wz=cz*16+z;for(let y=0;y<128;y++){const d=betaDensity(q,x,y,z);if(d>0)world.set(key(wx,y,wz),y===0?7:1);else if(y<63)world.set(key(wx,y,wz),9)}let h=height(wx,wz);if(h>0&&h<127){world.set(key(wx,h,wz),2);for(let d=1;d<=3&&h-d>0;d++)world.set(key(wx,h-d,wz),3);if(betaHash(wx*3,wz*7)>.965&&h>8){for(let y=1;y<=4;y++)world.set(key(wx,h+y,wz),17);for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=3;dy<=5;dy++)if(Math.abs(dx)+Math.abs(dz)+Math.abs(dy-4)<5)world.set(key(wx+dx,h+dy,wz+dz),18)}}}chunks.set(ck,[])}'''
          pattern=r"const key=\(x,y,z\)=>x\+','\+y\+','\+z,get=\(x,y,z\)=>world\.get\(key\(x,y,z\)\)\|\|0;function hash.*?function genChunk\(cx,cz\)\{.*?\nconst solid="
          s,n=re.subn(pattern,new+"\nconst solid=",s,flags=re.S)
          if n!=1: raise SystemExit(f'generator replacement count={n}')
          s=s.replace("const blocks={0:{solid:false,tile:0},","const blocks={0:{solid:false,tile:0},9:{solid:false,tile:0,liquid:true,name:'Agua'},")
          s=s.replace("for(let y=0;y<=64;y++){const b=get(x,y,z);if(!solid(b))continue;","for(let y=0;y<=127;y++){const b=get(x,y,z);if(!solid(b))continue;")
          s=s.replace("for(let x=a*CHUNK;x<a*CHUNK+CHUNK;x++)for(let z=b*CHUNK;z<b*CHUNK+CHUNK;z++)for(let y=0;y<=64;y++)world.delete","for(let x=a*CHUNK;x<a*CHUNK+CHUNK;x++)for(let z=b*CHUNK;z<b*CHUNK+CHUNK;z++)for(let y=0;y<=127;y++)world.delete")
          p.write_text(s,encoding='utf-8')
      - name: Commit terrain generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Implement Beta 1.7.3 Perlin terrain generation"
          git push
      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/apply-beta-terrain.yml
          git commit -m "Remove one-shot terrain migration workflow"
          git push
