name: Apply Beta terrain generator
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply generator
        run: python scripts/apply_beta_terrain.py
      - name: Commit generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/apply_beta_terrain.py .github/workflows/apply-beta-terrain.yml
          git commit -m "Implement Beta 1.7.3 Perlin terrain generation"
          git push
